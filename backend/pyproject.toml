[project]
name = "ctrlfree-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beSaif", email = "hishamkolikara@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "odfpy>=1.4.1",
    "openai>=3.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
ctrlfree-backend = "ctrlfree_backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
